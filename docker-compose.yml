services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeforge}
      POSTGRES_DB: ${POSTGRES_DB:-tradeforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # No ports exposed to the host - only reachable from other containers on the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Tradeforge API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:3100"]'
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tradeforge}:${POSTGRES_PASSWORD:-tradeforge}@postgres:5432/${POSTGRES_DB:-tradeforge}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_URL: http://localhost:3100
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
